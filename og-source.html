<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>og</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1200px; height:630px; overflow:hidden;}
  body{
    background:#ffffff;
    font-family:'Malgun Gothic','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    position:relative;
  }
  .wrap{
    position:relative;
    z-index:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:20px;
  }
  .badge{width:180px; height:180px;}
  .name{
    font-size:68px;
    font-weight:900;
    letter-spacing:2px;
    color:#0F1C2E;
  }
  .category{
    display:inline-block;
    padding:12px 30px;
    font-size:22px;
    font-weight:700;
    letter-spacing:1px;
    color:#1C8FA6;
    border:2.5px solid #1C8FA6;
    border-radius:40px;
  }
  .slogan{
    font-size:26px;
    font-weight:700;
    color:#5B6472;
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="badge" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="wingGrad" x1="10%" y1="90%" x2="95%" y2="10%">
      <stop offset="0%" stop-color="#1C8FA6"/><stop offset="100%" stop-color="#34C9C2"/></linearGradient></defs>
      <circle cx="42" cy="54" r="29" fill="none" stroke="url(#wingGrad)" stroke-width="6.5"/>
      <g fill="url(#wingGrad)" stroke="#fff" stroke-width="3" paint-order="stroke">
        <rect x="0" y="-4" width="78" height="8" rx="4" transform="translate(10,76) rotate(-32)"/>
        <rect x="0" y="-4" width="62" height="8" rx="4" transform="translate(18,58) rotate(-32)"/>
        <rect x="0" y="-4" width="44" height="8" rx="4" transform="translate(26,40) rotate(-32)"/>
      </g>
    </svg>
    <div class="name">천사모터스</div>
    <div class="category">중고차 매매</div>
    <div class="slogan">믿을 수 있는 중고차, 모든 중고차 판매</div>
  </div>
</body>
</html>
