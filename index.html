<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>천사모터스</title>

<meta property="og:type" content="website">
<meta property="og:title" content="천사모터스 | ANGEL MOTORS">
<meta property="og:description" content="믿을 수 있는 중고차, 모든 중고차 판매">
<meta property="og:image" content="https://evening466-cloud.github.io/angel-motors/og-image.png">
<meta property="og:url" content="https://evening466-cloud.github.io/angel-motors/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="천사모터스 | ANGEL MOTORS">
<meta name="twitter:description" content="믿을 수 있는 중고차, 모든 중고차 판매">
<meta name="twitter:image" content="https://evening466-cloud.github.io/angel-motors/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0F1C2E;
  --ink-2:#16283f;
  --ink-3:#1e3350;
  --gold:#1C8FA6;
  --gold-light:#34C9C2;
  --paper:#F7F5F0;
  --paper-2:#ffffff;
  --steel:#5B6472;
  --steel-light:#8b93a0;
  --line:rgba(28,143,166,0.22);
  --line-soft:rgba(15,28,46,0.1);
  --ok:#3f7d4f;
  --wait:#8a6d1f;
  --done:#8b93a0;
  --danger:#b3392c;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
}
h1,h2,h3{font-family:'Black Han Sans','Noto Sans KR',sans-serif; font-weight:400; margin:0;}
input,select,textarea,button{font-family:inherit;}
.num{font-variant-numeric:tabular-nums;}
a{color:inherit; text-decoration:none;}
button{cursor:pointer;}

#app{max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:0;}
#app.with-nav{padding-bottom:74px;}

/* ---------- halo motif ---------- */
.halo-divider{display:flex; align-items:center; gap:10px; margin:18px 0;}
.halo-divider::before,.halo-divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.halo-dot{width:12px;height:12px;border:2px solid var(--gold);border-radius:50%;box-shadow:0 0 10px rgba(28,143,166,0.55);flex:0 0 auto;}

.halo-badge{
  width:150px;height:150px;
  display:flex;align-items:center;justify-content:center;
  overflow:visible;
}
.halo-badge svg{width:100%;height:100%;overflow:visible;}

.price-halo{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:16px 30px;margin:6px 0;}
.price-halo::before{content:"";position:absolute;inset:0;border-radius:999px;border:2px solid var(--gold);box-shadow:0 0 0 6px rgba(28,143,166,0.12), 0 0 26px rgba(28,143,166,0.35);}
.price-halo .price-value{position:relative;font-size:30px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;}

/* ---------- card screen ---------- */
.card-shell{padding:26px 20px 34px;display:flex;flex-direction:column;gap:16px;min-height:100vh;background:#fff;}
.card-label{text-align:center;font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:700;text-transform:uppercase;opacity:0.9;}
.card-hero{text-align:center;padding:6px 0 2px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.card-hero img.logo-img{width:150px;height:150px;object-fit:contain;}
.biz-name{font-size:32px;letter-spacing:1px;color:var(--ink);}
.tagline{margin:0;font-size:14px;font-weight:700;color:var(--gold);letter-spacing:0.3px;}

.contact-block{display:flex;flex-direction:column;gap:10px;}
.contact-row{
  display:flex;align-items:center;gap:12px;
  background:var(--paper);border:1px solid var(--line-soft);border-radius:12px;
  padding:14px 16px;
}
.contact-row .c-icon{width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:rgba(28,143,166,0.12);}
.contact-row .c-icon svg{width:18px;height:18px;stroke:var(--gold);}
.contact-row .c-text{display:flex;flex-direction:column;gap:2px;min-width:0;}
.contact-row .c-label{font-size:11px;color:var(--steel);font-weight:700;}
.contact-row .c-value{font-size:15px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.tappable-row{cursor:pointer;}
.kakao-qr-block{
  display:flex;align-items:center;gap:14px;cursor:pointer;
  background:var(--paper);border:1px solid var(--line-soft);border-radius:12px;
  padding:14px 16px;
}
.kakao-qr-block img{width:88px;height:88px;border-radius:8px;object-fit:cover;background:#fff;border:1px solid var(--line-soft);flex:0 0 auto;}
.kakao-qr-placeholder{width:88px;height:88px;border-radius:8px;background:#fff;border:1px dashed var(--line-soft);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--steel-light);text-align:center;}
.kakao-qr-block .qr-text{display:flex;flex-direction:column;gap:3px;}
.kakao-qr-block .qr-title{font-size:14px;font-weight:800;color:var(--ink);}
.kakao-qr-block .qr-hint{font-size:12px;color:var(--steel);}

.cta-btn{
  display:block;width:100%;text-align:center;
  padding:17px;border-radius:12px;border:none;
  background:linear-gradient(180deg,var(--gold-light),var(--gold));
  color:#fff;font-size:16px;font-weight:900;letter-spacing:0.5px;
  box-shadow:0 8px 20px rgba(28,143,166,0.3);
}
.cta-btn:active{filter:brightness(0.95);}

.card-tapzone{cursor:pointer;}
.card-footer-note{text-align:center;font-size:12px;color:var(--steel);line-height:1.5;margin-top:2px;}

/* ---------- lightbox ---------- */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:flex;align-items:center;justify-content:center;z-index:200;padding:30px;}
.lightbox.hidden{display:none;}
.lightbox-box{background:#fff;border-radius:16px;padding:24px;text-align:center;max-width:340px;width:100%;}
.lightbox-box img{width:100%;max-width:260px;border-radius:8px;}
.lightbox-box .lb-id{margin-top:14px;font-size:15px;font-weight:800;color:var(--ink);}
.lightbox-box .lb-hint{margin-top:6px;font-size:12px;color:var(--steel);}
.lightbox-close{margin-top:18px;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:10px 22px;font-weight:700;}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:12px 20px;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,0.4);opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:300;max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- bottom nav ---------- */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;background:var(--paper-2);border-top:1px solid var(--line-soft);box-shadow:0 -4px 16px rgba(0,0,0,0.06);z-index:100;}
.bottom-nav.hidden{display:none;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 12px;font-size:12px;font-weight:700;color:var(--steel);}
.nav-item .nav-dot{width:6px;height:6px;border-radius:50%;background:transparent;}
.nav-item.active{color:var(--ink);}
.nav-item.active .nav-dot{background:var(--gold);box-shadow:0 0 8px rgba(28,143,166,0.7);}

/* ---------- generic page/panel ---------- */
.page{padding:18px 16px 28px;}
.page-title{font-size:22px;margin-bottom:14px;}
.panel{background:var(--paper-2);border:1px solid var(--line-soft);border-radius:12px;padding:16px;margin-bottom:14px;}
.panel-title{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:13px;font-weight:700;color:var(--steel);}
.field input,.field select,.field textarea{
  border:1px solid var(--line-soft);border-radius:8px;padding:11px 12px;font-size:14px;background:#fff;color:var(--ink);
}
.field textarea{resize:vertical;min-height:80px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:9px;border:none;font-weight:800;font-size:14px;}
.btn-gold{background:linear-gradient(180deg,var(--gold-light),var(--gold));color:var(--ink);}
.btn-outline{background:#fff;border:1px solid var(--line-soft);color:var(--ink);}
.btn-danger{background:#fff;border:1px solid rgba(179,57,44,0.4);color:var(--danger);}
.btn-block{width:100%;}
.btn:active{filter:brightness(0.95);}

/* ---------- search / filters ---------- */
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-soft);border-radius:10px;padding:11px 14px;margin-bottom:12px;}
.search-box svg{width:17px;height:17px;stroke:var(--steel);flex:0 0 auto;}
.search-box input{border:none;outline:none;flex:1;font-size:14px;background:transparent;}
.filter-chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;}
.chip{flex:0 0 auto;padding:8px 16px;border-radius:20px;border:1px solid var(--line-soft);background:#fff;font-size:13px;font-weight:700;color:var(--steel);}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}

/* ---------- car grid ---------- */
.car-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.car-card{background:#fff;border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;}
.car-thumb-wrap{position:relative;aspect-ratio:4/3;background:var(--paper);}
.car-thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.car-thumb-wrap .no-photo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--steel-light);font-size:12px;}
.status-badge{position:absolute;top:8px;left:8px;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:800;color:#fff;}
.status-badge.status-selling{background:var(--ok);}
.status-badge.status-talking{background:var(--wait);}
.status-badge.status-done{background:var(--done);}
.car-card-body{padding:10px 11px 13px;}
.car-card-title{font-size:14px;font-weight:800;margin-bottom:4px;line-height:1.3;}
.car-card-spec{font-size:11.5px;color:var(--steel);margin-bottom:7px;}
.car-card-price{font-size:16px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;}

.empty-state{text-align:center;padding:60px 20px;color:var(--steel);}
.empty-state svg{width:44px;height:44px;stroke:var(--gold);margin-bottom:14px;}
.empty-state p{margin:0;font-size:14px;line-height:1.6;}

/* ---------- detail page ---------- */
.gallery-main{width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--paper);margin-bottom:10px;}
.gallery-main img{width:100%;height:100%;object-fit:cover;}
.gallery-thumbs{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;}
.gallery-thumbs img{width:60px;height:60px;object-fit:cover;border-radius:8px;flex:0 0 auto;border:2px solid transparent;opacity:0.6;}
.gallery-thumbs img.active{border-color:var(--gold);opacity:1;}
.detail-title{font-size:22px;margin-bottom:4px;}
.detail-sub{font-size:13px;color:var(--steel);margin-bottom:16px;}
.spec-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
.spec-table tr{border-bottom:1px dashed var(--line-soft);}
.spec-table tr:last-child{border-bottom:none;}
.spec-table td{padding:10px 4px;font-size:14px;}
.spec-table td:first-child{color:var(--steel);font-weight:700;width:96px;}
.spec-table td:last-child{font-weight:700;font-variant-numeric:tabular-nums;}
.detail-desc{font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-wrap;margin-bottom:90px;}
.detail-cta-bar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;gap:10px;padding:12px 16px;background:var(--paper-2);border-top:1px solid var(--line-soft);z-index:90;}
.detail-cta-bar .btn{flex:1;}

/* ---------- admin ---------- */
.pin-wrap{padding:60px 24px;text-align:center;}
.pin-wrap h2{font-size:22px;margin-bottom:8px;}
.pin-wrap p{color:var(--steel);font-size:13px;margin-bottom:24px;}
.pin-input{width:100%;text-align:center;font-size:24px;letter-spacing:10px;padding:16px;border:1px solid var(--line-soft);border-radius:10px;margin-bottom:14px;font-variant-numeric:tabular-nums;}

.admin-tabs{display:flex;gap:8px;margin-bottom:16px;}
.admin-tab{flex:1;text-align:center;padding:11px 0;border-radius:9px;border:1px solid var(--line-soft);background:#fff;font-size:13px;font-weight:800;color:var(--steel);}
.admin-tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}

.admin-car-row{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line-soft);border-radius:10px;padding:10px;margin-bottom:10px;}
.admin-car-row img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--paper);flex:0 0 auto;}
.admin-car-row .ac-info{flex:1;min-width:0;}
.admin-car-row .ac-title{font-size:13.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.admin-car-row .ac-meta{font-size:12px;color:var(--steel);margin-top:2px;}
.admin-car-row .ac-actions{display:flex;gap:6px;}
.admin-car-row .ac-actions button{padding:8px 10px;font-size:12px;}

.photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.photo-thumb{position:relative;width:70px;height:70px;border-radius:8px;overflow:hidden;background:var(--paper);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-thumb .rm{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;border:none;font-size:12px;line-height:1;}
.photo-add-btn{width:70px;height:70px;border-radius:8px;border:1px dashed var(--line-soft);background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--steel-light);}
.url-add-row{display:flex;gap:8px;margin-bottom:14px;}
.url-add-row input{flex:1;}

.setup-notice{margin:20px 16px;padding:18px;border:1px dashed var(--line);border-radius:12px;background:#fff;font-size:13px;line-height:1.7;color:var(--steel);}
.setup-notice b{color:var(--ink);}
</style>
</head>
<body>

<div id="app"></div>
<nav id="bottomNav" class="bottom-nav hidden">
  <a href="#/" class="nav-item" data-route="card">
    <span class="nav-dot"></span>명함
  </a>
  <a href="#/site" class="nav-item" data-route="site">
    <span class="nav-dot"></span>매물
  </a>
  <a href="#/admin" class="nav-item" data-route="admin">
    <span class="nav-dot"></span>관리자
  </a>
</nav>

<div id="lightbox" class="lightbox hidden">
  <div class="lightbox-box">
    <img id="lightboxImg" src="" alt="카카오톡 QR">
    <div class="lb-id" id="lightboxId"></div>
    <div class="lb-hint">카카오톡 앱에서 QR코드를 스캔해주세요</div>
    <button class="lightbox-close" id="lightboxCloseBtn">닫기</button>
  </div>
</div>

<div id="toast"></div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
/* =========================================================
   FIREBASE CONFIG — Firebase 콘솔의 "내 앱 > 웹 앱"에서 복사한
   6개 값을 아래에 그대로 붙여넣으세요. (설정 > 일반 > 내 앱)

   참고: Firebase Storage는 유료(Blaze) 요금제가 있어야 켤 수 있어서
   쓰지 않습니다. 사진은 압축한 뒤 Firestore 문서 안에 직접 저장합니다
   (카드 등록·추가 계정 필요 없음). 더 큰 원본 화질이 필요하면
   관리자 화면의 "외부 이미지 URL 추가" 기능을 사용하세요.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCn9B34x6dTvWEk8io2w78rUGcgQf00I-w",
  authDomain: "project-6997677676935249162.firebaseapp.com",
  projectId: "project-6997677676935249162",
  storageBucket: "project-6997677676935249162.firebasestorage.app",
  messagingSenderId: "1068546118463",
  appId: "1:1068546118463:web:89b7f84d2c41800980b98a"
};

const FIREBASE_READY = firebaseConfig.apiKey !== "YOUR_API_KEY";
let db = null;
if (FIREBASE_READY) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}

/* =========================================================
   STATE
   ========================================================= */
function defaultSettings(){
  return {
    shopName: "천사모터스",
    englishName: "ANGEL MOTORS Co., Ltd.",
    tagline: "믿을 수 있는 중고차, 모든 중고차 판매",
    phone: "010-5035-0444",
    address: "청주시 청원구 2순환로 50",
    logoUrl: "",
    kakaoId: "operationcw",
    kakaoQrUrl: "",
    adminPin: "1004"
  };
}
let settings = defaultSettings();
let cars = [];
let dataLoaded = { settings:false, cars:false };
let isAdminAuthed = false;
let adminView = "cars-list"; // cars-list | car-form | settings
let adminTab = "cars";       // cars | settings
let editingCarId = null;
let carFormPhotos = [];
let carFormRef = null;
let detailActiveIndex = 0;
let siteSearch = "";
let siteFilter = "전체";

/* =========================================================
   FIRESTORE SYNC
   ========================================================= */
if (FIREBASE_READY) {
  db.collection("settings").doc("main").onSnapshot(function(doc){
    if (doc.exists) {
      settings = Object.assign(defaultSettings(), doc.data());
    } else {
      db.collection("settings").doc("main").set(defaultSettings());
    }
    dataLoaded.settings = true;
    router();
  }, function(err){ console.error(err); showToast("설정을 불러오지 못했습니다"); });

  db.collection("cars").orderBy("createdAt","desc").onSnapshot(function(snap){
    cars = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    dataLoaded.cars = true;
    router();
  }, function(err){ console.error(err); showToast("매물 정보를 불러오지 못했습니다"); });
}

/* =========================================================
   ROUTER
   ========================================================= */
window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", router);

function router(){
  if (!FIREBASE_READY) { renderSetupNotice(); return; }

  var hash = location.hash.replace(/^#/, "") || "/";
  var app = document.getElementById("app");
  var nav = document.getElementById("bottomNav");

  if (hash === "/" ) {
    document.body.className = "";
    app.className = "";
    nav.classList.add("hidden");
    renderCard(app);
    return;
  }

  document.body.className = "";
  app.className = "with-nav";
  nav.classList.remove("hidden");
  setActiveNav(hash);

  if (hash === "/site") { renderSite(app); return; }
  var detailMatch = hash.match(/^\/site\/(.+)$/);
  if (detailMatch) { renderDetail(app, detailMatch[1]); return; }
  if (hash === "/admin") { renderAdmin(app); return; }

  location.hash = "/";
}

function setActiveNav(hash){
  var items = document.querySelectorAll(".nav-item");
  items.forEach(function(el){
    var r = el.getAttribute("data-route");
    var isActive = (r === "site" && hash.indexOf("/site") === 0) || (r === "admin" && hash.indexOf("/admin") === 0);
    el.classList.toggle("active", isActive);
  });
}

function renderSetupNotice(){
  document.getElementById("bottomNav").classList.add("hidden");
  document.body.className = "";
  document.getElementById("app").innerHTML =
    '<div class="setup-notice">' +
    '<b>Firebase 연결이 필요합니다.</b><br><br>' +
    'index.html 하단의 <code>firebaseConfig</code> 값을 Firebase 콘솔에서 복사한 값으로 채워주세요.<br><br>' +
    '설정 > 프로젝트 설정 > 일반 > 내 앱 에서 확인할 수 있습니다.' +
    '</div>';
}

/* =========================================================
   SCREEN 1 — 모바일 명함
   ========================================================= */
function renderCard(app){
  app.innerHTML =
    '<div class="card-shell">' +
      '<div class="card-label">MOBILE BUSINESS CARD</div>' +
      '<div class="card-hero">' +
        (settings.logoUrl
          ? '<img class="logo-img" src="' + esc(settings.logoUrl) + '" alt="로고">'

/* =========================================================
   SCREEN 2 — 매물 홈페이지(목록)
   ========================================================= */
function renderSite(app){
  if (!dataLoaded.cars) { app.innerHTML = '<div class="page"><p>불러오는 중...</p></div>'; return; }

  var filtered = cars.filter(function(c){
    var matchStatus = siteFilter === "전체" || c.status === siteFilter;
    var q = siteSearch.trim().toLowerCase();
    var matchQuery = !q || (c.brand + " " + c.model).toLowerCase().indexOf(q) !== -1;
    return matchStatus && matchQuery;
  });

  var statuses = ["전체","판매중","상담중","판매완료"];

  app.innerHTML =
    '<div class="page">' +
      '<h2 class="page-title">매물</h2>' +
      '<div class="search-box">' + searchSvg() +
        '<input id="siteSearchInput" placeholder="차종, 모델명 검색" value="' + esc(siteSearch) + '">' +
      '</div>' +
      '<div class="filter-chips" id="filterChips">' +
        statuses.map(function(s){
          return '<div class="chip' + (siteFilter === s ? ' active' : '') + '" data-status="' + s + '">' + s + '</div>';
        }).join("") +
      '</div>' +
      (filtered.length === 0
        ? '<div class="empty-state">' + carSvg() + '<p>등록된 매물이 없습니다.<br>관리자 페이지에서 첫 차량을 등록해보세요.</p></div>'
        : '<div class="car-grid">' + filtered.map(carCardHtml).join("") + '</div>'
      ) +
    '</div>';

  document.getElementById("siteSearchInput").addEventListener("input", function(e){
    siteSearch = e.target.value; renderSite(app);
    var el = document.getElementById("siteSearchInput"); el.focus(); el.selectionStart = el.selectionEnd = el.value.length;
  });
  document.getElementById("filterChips").addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if (!chip) return;
    siteFilter = chip.getAttribute("data-status");
    renderSite(app);
  });
  document.querySelectorAll(".car-card").forEach(function(el){
    el.addEventListener("click", function(){ location.hash = "/site/" + el.getAttribute("data-id"); });
  });
}

function carCardHtml(c){
  var thumb = c.photos && c.photos[0];
  var statusClass = c.status === "판매중" ? "status-selling" : c.status === "상담중" ? "status-talking" : "status-done";
  return (
    '<div class="car-card" data-id="' + c.id + '">' +
      '<div class="car-thumb-wrap">' +
        (thumb ? '<img src="' + esc(thumb) + '" alt="">' : '<div class="no-photo">사진 없음</div>') +
        '<span class="status-badge ' + statusClass + '">' + c.status + '</span>' +
      '</div>' +
      '<div class="car-card-body">' +
        '<div class="car-card-title">' + esc(c.brand) + ' ' + esc(c.model) + '</div>' +
        '<div class="car-card-spec num">' + c.year + '년 · ' + (c.mileage||0).toLocaleString("ko-KR") + 'km · ' + esc(c.fuel) + '</div>' +
        '<div class="car-card-price num">' + (c.price||0).toLocaleString("ko-KR") + '만원</div>' +
      '</div>' +
    '</div>'
  );
}

        '<tr><td>변속기</td><td>' + esc(c.transmission) + '</td></tr>' +
        '<tr><td>색상</td><td>' + esc(c.color) + '</td></tr>' +

      '<div class="detail-desc">' + esc(c.description || "") + '</div>' +
    '</div>' +

    '<div class="detail-cta-bar">' +

}

function renderAdmin(app){
  if (!isAdminAuthed) { renderAdminLogin(app); return; }

  app.innerHTML =
    '<div class="page">' +
      '<h2 class="page-title">관리자</h2>' +
      '<div class="admin-tabs">' +
        '<div class="admin-tab' + (adminTab==="cars"?" active":"") + '" data-tab="cars">차량 관리</div>' +
        '<div class="admin-tab' + (adminTab==="settings"?" active":"") + '" data-tab="settings">명함·설정</div>' +
      '</div>' +
      '<div id="adminBody"></div>' +
    '</div>';

  document.querySelectorAll(".admin-tab").forEach(function(el){
    el.addEventListener("click", function(){
      adminTab = el.getAttribute("data-tab");
      adminView = adminTab === "cars" ? "cars-list" : "settings";
      renderAdmin(app);
    });
  });

  var body = document.getElementById("adminBody");
  if (adminTab === "cars") {
    if (adminView === "car-form") renderAdminCarForm(body);
    else renderAdminCarsList(body);
  } else {
    renderAdminSettings(body);
  }
}

function renderAdminLogin(app){
  app.innerHTML =
    '<div class="pin-wrap">' +
      '<h2>관리자 로그인</h2>' +
      '<p>4자리 PIN을 입력해주세요</p>' +
      '<input type="tel" maxlength="8" class="pin-input" id="pinInput" placeholder="••••">' +
      '<button class="btn btn-gold btn-block" id="pinSubmitBtn">확인</button>' +
    '</div>';

  var input = document.getElementById("pinInput");
  input.focus();
  function tryLogin(){
    if (input.value === settings.adminPin) {
      isAdminAuthed = true;
      adminView = "cars-list"; adminTab = "cars";
      renderAdmin(app);
    } else {
      showToast("PIN이 올바르지 않습니다");
      input.value = "";
    }
  }
  document.getElementById("pinSubmitBtn").addEventListener("click", tryLogin);
  input.addEventListener("keydown", function(e){ if (e.key === "Enter") tryLogin(); });
}

function renderAdminCarsList(body){
  body.innerHTML =
    '<button class="btn btn-gold btn-block" id="newCarBtn" style="margin-bottom:16px;">+ 새 차량 등록</button>' +
    (cars.length === 0
      ? '<div class="empty-state">' + carSvg() + '<p>등록된 차량이 없습니다.<br>새 차량을 등록해보세요.</p></div>'
      : cars.map(function(c){
          var thumb = c.photos && c.photos[0];
          return (
            '<div class="admin-car-row">' +
              (thumb ? '<img src="' + esc(thumb) + '">' : '<div class="photo-add-btn" style="opacity:.4;">-</div>') +
              '<div class="ac-info">' +
                '<div class="ac-title">' + esc(c.brand) + ' ' + esc(c.model) + '</div>' +
                '<div class="ac-meta num">' + (c.price||0).toLocaleString("ko-KR") + '만원 · ' + c.status + '</div>' +
              '</div>' +
              '<div class="ac-actions">' +
                '<button class="btn btn-outline" data-edit="' + c.id + '">수정</button>' +
                '<button class="btn btn-danger" data-del="' + c.id + '">삭제</button>' +
              '</div>' +
            '</div>'
          );
        }).join("")
    );

  document.getElementById("newCarBtn").addEventListener("click", function(){
    editingCarId = null;
    carFormRef = db.collection("cars").doc();
    carFormPhotos = [];
    adminView = "car-form";
    renderAdmin(document.getElementById("app"));
  });
  body.querySelectorAll("[data-edit]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.getAttribute("data-edit");
      var c = cars.find(function(x){ return x.id === id; });
      editingCarId = id;
      carFormRef = db.collection("cars").doc(id);
      carFormPhotos = (c.photos || []).slice();
      adminView = "car-form";
      renderAdmin(document.getElementById("app"));
    });
  });
  body.querySelectorAll("[data-del]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.getAttribute("data-del");
      if (!confirm("이 차량을 삭제할까요? 되돌릴 수 없습니다.")) return;
      db.collection("cars").doc(id).delete().then(function(){
        showToast("삭제되었습니다");
      }).catch(function(){ showToast("삭제에 실패했습니다"); });
    });
  });
}

function renderAdminCarForm(body){
  var c = editingCarId ? cars.find(function(x){ return x.id === editingCarId; }) : {};
  c = c || {};
  var fuels = ["가솔린","디젤","하이브리드","전기","LPG"];
  var transmissions = ["오토","수동"];
  var statuses = ["판매중","상담중","판매완료"];

  body.innerHTML =
    '<div class="panel-title">' + (editingCarId ? "차량 정보 수정" : "새 차량 등록") + '</div>' +
    '<div class="field-row">' +
      '<div class="field"><label>제조사</label><input id="fBrand" value="' + esc(c.brand||"") + '"></div>' +
      '<div class="field"><label>모델명</label><input id="fModel" value="' + esc(c.model||"") + '"></div>' +
    '</div>' +
    '<div class="field-row">' +
      '<div class="field"><label>연식</label><input id="fYear" type="number" value="' + (c.year||"") + '"></div>' +
      '<div class="field"><label>가격(만원)</label><input id="fPrice" type="number" value="' + (c.price||"") + '"></div>' +
    '</div>' +
    '<div class="field-row">' +
      '<div class="field"><label>주행거리(km)</label><input id="fMileage" type="number" value="' + (c.mileage||"") + '"></div>' +
      '<div class="field"><label>색상</label><input id="fColor" value="' + esc(c.color||"") + '"></div>' +
    '</div>' +
    '<div class="field-row">' +
      '<div class="field"><label>연료</label><select id="fFuel">' + fuels.map(function(f){ return '<option' + (c.fuel===f?' selected':'') + '>' + f + '</option>'; }).join("") + '</select></div>' +
      '<div class="field"><label>변속기</label><select id="fTransmission">' + transmissions.map(function(t){ return '<option' + (c.transmission===t?' selected':'') + '>' + t + '</option>'; }).join("") + '</select></div>' +
    '</div>' +
    '<div class="field"><label>판매상태</label><select id="fStatus">' + statuses.map(function(s){ return '<option' + (c.status===s?' selected':'') + '>' + s + '</option>'; }).join("") + '</select></div>' +
    '<div class="field"><label>설명</label><textarea id="fDescription">' + esc(c.description||"") + '</textarea></div>' +

    '<div class="field"><label>사진 (최대 8장, 첫 장이 대표 사진)</label>' +
      '<div class="photo-grid" id="photoGrid"></div>' +
      '<input type="file" id="photoFileInput" accept="image/*" multiple style="display:none;">' +
      '<div class="url-add-row">' +
        '<input id="photoUrlInput" placeholder="외부 이미지 URL 붙여넣기">' +
        '<button class="btn btn-outline" id="photoUrlAddBtn">추가</button>' +
      '</div>' +
    '</div>' +

    '<div class="field-row">' +
      '<button class="btn btn-outline btn-block" id="cancelCarBtn">취소</button>' +
      '<button class="btn btn-gold btn-block" id="saveCarBtn">저장</button>' +
    '</div>';

  renderPhotoGrid();

  function renderPhotoGrid(){
    var grid = document.getElementById("photoGrid");
    grid.innerHTML = carFormPhotos.map(function(p,i){
      return '<div class="photo-thumb"><img src="' + esc(p) + '"><button class="rm" data-i="' + i + '">×</button></div>';
    }).join("") + (carFormPhotos.length < 8 ? '<div class="photo-add-btn" id="photoAddBtn">+</div>' : '');

    var addBtn = document.getElementById("photoAddBtn");
    if (addBtn) addBtn.addEventListener("click", function(){ document.getElementById("photoFileInput").click(); });
    grid.querySelectorAll(".rm").forEach(function(btn){
      btn.addEventListener("click", function(){
        carFormPhotos.splice(Number(btn.getAttribute("data-i")), 1);
        renderPhotoGrid();
      });
    });
  }

  document.getElementById("photoFileInput").addEventListener("change", function(e){
    var files = Array.prototype.slice.call(e.target.files).slice(0, 8 - carFormPhotos.length);
    if (files.length === 0) return;
    showToast("사진 처리 중...");
    (function processNext(i, added){
      if (i >= files.length) {
        carFormPhotos = carFormPhotos.concat(added);
        renderPhotoGrid();
        showToast(added.length < files.length ? "용량 제한으로 일부만 추가되었습니다. 나머지는 외부 이미지 URL을 이용해주세요" : "사진이 추가되었습니다");
        return;
      }
      compressImageToDataURL(files[i], 960, 0.6).then(function(dataUrl){
        var totalSize = photosByteSize(carFormPhotos) + photosByteSize(added) + dataUrl.length;
        if (totalSize > CAR_PHOTOS_MAX_BYTES) {
          carFormPhotos = carFormPhotos.concat(added);
          renderPhotoGrid();
          showToast("사진 용량이 가득 찼습니다. 나머지는 외부 이미지 URL을 이용해주세요");
          return;
        }
        added.push(dataUrl);
        processNext(i + 1, added);
      }).catch(function(){ showToast("사진 처리에 실패했습니다"); });
    })(0, []);
    e.target.value = "";
  });

  document.getElementById("photoUrlAddBtn").addEventListener("click", function(){
    var input = document.getElementById("photoUrlInput");
    var url = input.value.trim();
    if (!url) return;
    if (carFormPhotos.length >= 8) { showToast("사진은 최대 8장까지 등록할 수 있습니다"); return; }
    carFormPhotos.push(url);
    input.value = "";
    renderPhotoGrid();
  });

  document.getElementById("cancelCarBtn").addEventListener("click", function(){
    adminView = "cars-list";
    renderAdmin(document.getElementById("app"));
  });

  document.getElementById("saveCarBtn").addEventListener("click", function(){
    var data = {
      brand: document.getElementById("fBrand").value.trim(),
      model: document.getElementById("fModel").value.trim(),
      year: Number(document.getElementById("fYear").value) || 0,
      price: Number(document.getElementById("fPrice").value) || 0,
      mileage: Number(document.getElementById("fMileage").value) || 0,
      color: document.getElementById("fColor").value.trim(),
      fuel: document.getElementById("fFuel").value,
      transmission: document.getElementById("fTransmission").value,
      status: document.getElementById("fStatus").value,
      description: document.getElementById("fDescription").value.trim(),
      photos: carFormPhotos
    };
    if (!data.brand || !data.model) { showToast("제조사와 모델명을 입력해주세요"); return; }

    var promise = editingCarId
      ? carFormRef.update(data)
      : carFormRef.set(Object.assign({}, data, { createdAt: firebase.firestore.FieldValue.serverTimestamp() }));

    promise.then(function(){
      showToast("저장되었습니다");
      adminView = "cars-list";
      renderAdmin(document.getElementById("app"));
    }).catch(function(){ showToast("저장에 실패했습니다"); });
  });
}

    function draw(currentUrl){
      grid.innerHTML = currentUrl
        ? '<div class="photo-thumb"><img src="' + esc(currentUrl) + '"></div><div class="photo-add-btn" id="' + gridId + 'Add">교체</div>'
        : '<div class="photo-add-btn" id="' + gridId + 'Add">+</div>';
      document.getElementById(gridId + "Add").addEventListener("click", function(){ document.getElementById(inputId).click(); });
    }
    draw(url);
    document.getElementById(inputId).addEventListener("change", function(e){
      var file = e.target.files[0];
      if (!file) return;
      showToast("처리 중...");
      compressImageToDataURL(file, 400, 0.75).then(function(dataUrl){
        onUploaded(dataUrl);
        draw(dataUrl);
        showToast("완료되었습니다");
      }).catch(function(){ showToast("처리에 실패했습니다"); });
      e.target.value = "";
    });
  }

  document.getElementById("saveSettingsBtn").addEventListener("click", function(){
    var data = {
      shopName: document.getElementById("sShopName").value.trim(),
      tagline: document.getElementById("sTagline").value.trim(),
      phone: document.getElementById("sPhone").value.trim(),
      address: document.getElementById("sAddress").value.trim(),
      kakaoId: document.getElementById("sKakaoId").value.trim(),
      logoUrl: settings.logoUrl,
      kakaoQrUrl: settings.kakaoQrUrl
    };
    db.collection("settings").doc("main").set(data, { merge: true }).then(function(){
      showToast("저장되었습니다");
    }).catch(function(){ showToast("저장에 실패했습니다"); });
  });

  document.getElementById("changePinBtn").addEventListener("click", function(){
    var p1 = document.getElementById("sPinNew").value.trim();
    var p2 = document.getElementById("sPinConfirm").value.trim();
    if (!p1 || p1.length < 4) { showToast("4자리 이상의 PIN을 입력해주세요"); return; }
    if (p1 !== p2) { showToast("PIN이 서로 일치하지 않습니다"); return; }
    db.collection("settings").doc("main").set({ adminPin: p1 }, { merge: true }).then(function(){
      showToast("비밀번호가 변경되었습니다");
      document.getElementById("sPinNew").value = "";
      document.getElementById("sPinConfirm").value = "";
    }).catch(function(){ showToast("변경에 실패했습니다"); });
  });
}

/* =========================================================
   IMAGE COMPRESSION — Storage(유료) 대신 압축 후 Firestore 문서에
   base64로 직접 저장합니다. Firestore 문서는 1MB 제한이 있어
   차량 사진 총합은 CAR_PHOTOS_MAX_BYTES 안에서만 추가됩니다.
   ========================================================= */
var CAR_PHOTOS_MAX_BYTES = 700000;

function photosByteSize(photos){
  return photos.reduce(function(sum, p){ return sum + p.length; }, 0);
}

function compressImageToDataURL(file, maxWidth, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   UTIL
   ========================================================= */
function esc(str){
  return String(str == null ? "" : str).replace(/[&<>"']/g, function(ch){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch];
  });
}

function copyToClipboard(text, onSuccess){
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(onSuccess).catch(function(){ fallbackCopy(text, onSuccess); });
  } else {
    fallbackCopy(text, onSuccess);
  }
}
function fallbackCopy(text, onSuccess){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand("copy"); onSuccess(); }
  catch (e) { showToast("복사에 실패했습니다: " + text); }
  document.body.removeChild(ta);
}

var toastTimer = null;
function showToast(msg){
  var toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 2200);
}

function openLightbox(){
  document.getElementById("lightboxImg").src = settings.kakaoQrUrl || "";
  document.getElementById("lightboxId").textContent = "ID: " + settings.kakaoId;
  document.getElementById("lightbox").classList.remove("hidden");
}
document.getElementById("lightbox").addEventListener("click", function(e){
  if (e.target.id === "lightbox") document.getElementById("lightbox").classList.add("hidden");
});
document.getElementById("lightboxCloseBtn").addEventListener("click", function(){
  document.getElementById("lightbox").classList.add("hidden");
});
